<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>shipstores motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; background: #f4f0e8; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Everything is a pure function of time: renderAt(t) draws frame t (seconds), so the
// frame-by-frame capture in capture.py is deterministic. The live preview loops it with rAF.
// Clawd is the Claude Code mascot by Anthropic; shipstores is not affiliated with Anthropic.
const W = 1280, H = 720, DURATION = 17;
const GROUND = 520;
const C = {
  cream: "#f4f0e8", ground: "#ebe4d7", horizon: "#ddd4c3", ink: "#1f1b16", ink2: "#5c554b",
  clawd: "#d97757", clawdTop: "#e48b6c", clawdSide: "#b05a3c",
  card: "#fffdf8", cardSide: "#e6ddcc", stroke: "#e0d7c6",
  term: "#1c1a17", termLine: "#2e2a25", termText: "#ede7dc", termDim: "#9a9185",
  blue: "#2f7cf6", blueTint: "#e3eeff", green: "#1fa463", greenTint: "#dcf5e8",
  amber: "#b7790d", amberTint: "#fff0d1", red: "#d64545", redTint: "#fde2e2",
  box: "#d4a373", boxSide: "#b4844f", tape: "#ecd2a6", toolBlue: "#7fb0ff", okGreen: "#4cd38a", tagOrange: "#ff8a5c",
};
const ctx = document.getElementById("c").getContext("2d");

// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function text(s, x, y, font, color, align = "left", alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); ctx.restore();
}
function shadow(x, y, w, a = 0.18) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = "#6b5a44";
  ctx.beginPath(); ctx.ellipse(x, y, w / 2, w / 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}

// ---------------------------------------------------------------- Clawd
// Drawn from blocks like the 3D-printed fan figures: a front face, a darker extruded side
// and a lighter top edge. (x, y) = bottom centre, u = unit size.
function clawdShape(u, legLift, arm) {
  const parts = [];
  parts.push([-5 * u, -7.1 * u, 10 * u, 5.5 * u]);                        // body
  parts.push([-6.4 * u, -5.5 * u + arm.l * u, 1.4 * u, 1.6 * u]);         // left arm
  parts.push([5 * u, -5.5 * u - arm.r * u, 1.4 * u, 1.6 * u + arm.r * u]); // right arm (can wave up)
  const legsX = [-3.8, -2.0, 1.1, 2.9];
  legsX.forEach((lx, i) => parts.push([lx * u, -1.7 * u - legLift[i] * u, 0.9 * u, 1.7 * u]));
  return parts;
}
function clawd(x, y, u, o = {}) {
  const { legLift = [0, 0, 0, 0], arm = { l: 0, r: 0 }, eyes = "open", sx = 1, sy = 1, flip = false, rot = 0 } = o;
  shadow(x, y + 2, 11 * u * sx, 0.16);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx * (flip ? -1 : 1), sy);
  const parts = clawdShape(u, legLift, arm);
  const d = 0.55 * u;                                                     // extrusion depth
  ctx.fillStyle = C.clawdSide;
  parts.forEach(([px, py, pw, ph]) => ctx.fillRect(px + d, py + d * 0.6, pw, ph));
  ctx.fillStyle = C.clawd;
  parts.forEach(([px, py, pw, ph]) => ctx.fillRect(px, py, pw, ph));
  ctx.fillStyle = C.clawdTop;
  ctx.fillRect(-5 * u, -7.1 * u, 10 * u, 0.45 * u);
  // eyes
  ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const ex = [-2.6 * u, 1.8 * u], ey = -5.8 * u;
  if (eyes === "open") ex.forEach(e => ctx.fillRect(e, ey, 0.8 * u, 1.7 * u));
  else if (eyes === "blink") ex.forEach(e => ctx.fillRect(e - 0.1 * u, ey + 0.8 * u, 1.0 * u, 0.3 * u));
  else if (eyes === "wide") ex.forEach(e => ctx.fillRect(e - 0.3 * u, ey - 0.3 * u, 1.4 * u, 2.1 * u));
  else if (eyes === "happy") {
    ctx.lineWidth = 0.42 * u;
    ctx.beginPath(); ctx.moveTo(-2.9 * u, ey); ctx.lineTo(-1.9 * u, ey + 0.8 * u); ctx.lineTo(-2.9 * u, ey + 1.6 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2.9 * u, ey); ctx.lineTo(1.9 * u, ey + 0.8 * u); ctx.lineTo(2.9 * u, ey + 1.6 * u); ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- props
function box(x, y, w, icon) {          // (x, y) = bottom left
  const h = w * 0.78, d = w * 0.12;
  ctx.fillStyle = C.boxSide; ctx.fillRect(x + d, y - h + d * 0.6, w, h);
  ctx.fillStyle = C.box; ctx.fillRect(x, y - h, w, h);
  ctx.fillStyle = C.tape; ctx.fillRect(x + w * 0.42, y - h, w * 0.16, h * 0.45);
  rr(x + w * 0.3, y - h * 0.42, w * 0.4, h * 0.3, w * 0.07, icon);
}
function sparkle(x, y, r, color, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rad = i % 2 ? r * 0.35 : r; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

// ---------------------------------------------------------------- story
const PROMPT = "Ship 1.2.0 to both stores and submit for review.";
const LOG = [
  [1.0, "eas_build_start", "ios + android", ""],
  [4.6, "apple_upload_build", "MyApp.ipa · VALID", ""],
  [5.0, "apple_set_app_privacy", "label published", "no public API"],
  [5.4, "apple_submit_for_review", "Waiting for Review", ""],
  [6.95, "play_upload_bundle", "versionCode 42", ""],
  [7.35, "play_content_answer", "11/11 declarations", "no public API"],
  [7.75, "play_submit_for_review", "Changes in review", ""],
  [9.3, "apple_review_messages", "2.1 · screen recording asked", "rejected"],
  [10.9, "apple_reply_review", "+ demo.mp4", ""],
  [11.7, "apple_resubmit_for_review", "Waiting for Review", ""],
];
const CAPTIONS = [
  [0.0, 2.4, "Your agent builds both apps…", C.ink],
  [2.4, 8.2, "…and ships them to both stores.", C.ink],
  [8.3, 11.8, "Apple says no. It handles that too.", C.red],
  [11.85, 13.4, "Back in review. You did nothing.", C.ink],
];
const IOS_X = 720, PLAY_X = 990, SHOP_W = 236;
const PATH = [[0, 400], [2.3, 400], [4.5, IOS_X + 72], [5.9, IOS_X + 72], [6.9, PLAY_X + 72], [8.6, PLAY_X + 72], [9.3, IOS_X + 180], [13.3, IOS_X + 180]];
function robotX(t) {
  for (let i = 0; i < PATH.length - 1; i++) {
    const [t0, x0] = PATH[i], [t1, x1] = PATH[i + 1];
    if (t <= t1) return { x: lerp(x0, x1, easeInOut((t - t0) / (t1 - t0))), moving: x0 !== x1 && t > t0, dir: Math.sign(x1 - x0) || 1 };
  }
  return { x: PATH[PATH.length - 1][1], moving: false, dir: 1 };
}

// ---------------------------------------------------------------- scene
function backdrop() {
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  const blob = (x, y, r, c) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, "rgba(244,240,232,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  blob(1050, 180, 420, "rgba(217,119,87,0.16)");
  blob(260, 420, 380, "rgba(47,124,246,0.06)");
  ctx.fillStyle = C.ground; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = C.horizon; ctx.fillRect(0, GROUND, W, 3);
}

function workshop(t) {
  const x = 80, w = 230, y = GROUND;
  // desk
  rr(x + 10, y - 86, w - 20, 18, 6, C.card, C.stroke);
  ctx.fillStyle = C.cardSide; ctx.fillRect(x + 28, y - 68, 14, 68); ctx.fillRect(x + w - 42, y - 68, 14, 68);
  // laptop
  rr(x + 66, y - 160, 104, 70, 8, C.term);
  text(">_", x + 118, y - 125, "700 22px 'JetBrains Mono'", C.clawd, "center");
  rr(x + 52, y - 92, 132, 8, 4, "#cfc6b5");
  rr(x + 74, y - 196, 88, 26, 13, C.card, C.stroke);
  text("~/my-app", x + 118, y - 183, "700 13px 'JetBrains Mono'", C.ink2, "center");
  if (t > 0.95 && t < 2.3) {
    for (let i = 0; i < 6; i++) {
      const a = (t * 1.6 + i / 6) % 1;
      sparkle(400 + Math.cos(i * 2.1) * (40 + a * 60), y - 110 - a * 80, 9 * (1 - a) + 3, i % 2 ? C.clawd : "#e0a63a", 1 - a);
    }
  }
}

const STATUS = {
  none: [C.ink2, "#efe9de", "Not submitted"], wait: [C.amber, C.amberTint, "Waiting for Review"],
  review: [C.amber, C.amberTint, "In review"], rej: [C.red, C.redTint, "Rejected · 2.1"],
};

function shop(x, name, color, tint, kind, flash, t) {
  const top = GROUND - 300, d = 14;
  ctx.fillStyle = C.cardSide; ctx.fillRect(x + d, top + d, SHOP_W, 300 - d);   // depth
  rr(x, top, SHOP_W, 300, 10, C.card, C.stroke);
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, top, SHOP_W, 300, 10); ctx.clip();
  ctx.fillStyle = color; ctx.fillRect(x, top, SHOP_W, 14);
  ctx.restore();
  text(name, x + SHOP_W / 2, top + 46, "800 28px 'Bricolage Grotesque'", C.ink, "center");
  // scalloped awning
  const ay = top + 74, n = 8, sw = SHOP_W / n;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i % 2 ? color : C.card;
    ctx.fillRect(x + i * sw, ay, sw, 20);
    ctx.beginPath(); ctx.arc(x + i * sw + sw / 2, ay + 20, sw / 2, 0, Math.PI); ctx.fill();
  }
  ctx.strokeStyle = C.stroke; ctx.lineWidth = 2; ctx.strokeRect(x, ay, SHOP_W, 0.01);
  // status pill
  const [c, bg, label] = STATUS[kind];
  const pulse = flash ? 0.82 + 0.18 * Math.abs(Math.sin(t * 9)) : 1;
  ctx.save(); ctx.globalAlpha = pulse;
  rr(x + 18, top + 132, SHOP_W - 36, 46, 23, bg);
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 42, top + 155, 6, 0, 7); ctx.fill();
  text(label, x + 56, top + 156, "700 17px 'Bricolage Grotesque'", c);
  ctx.restore();
  // door
  ctx.beginPath(); ctx.roundRect(x + SHOP_W / 2 - 34, GROUND - 104, 68, 104, [34, 34, 0, 0]);
  ctx.fillStyle = tint; ctx.fill(); ctx.strokeStyle = C.stroke; ctx.stroke();
}

function stamp(t) {
  if (t < 8.3 || t > 9.7) return;
  const k = back(seg(t, 8.3, 8.55));
  const fade = 1 - seg(t, 9.3, 9.7);
  const shake = t < 8.7 ? Math.sin(t * 80) * 7 * (1 - seg(t, 8.5, 8.7)) : 0;
  ctx.save();
  ctx.translate(IOS_X + SHOP_W / 2 + shake, GROUND - 200);
  ctx.rotate(-0.16);
  const s = lerp(2.4, 1, clamp(k, 0, 1.2));
  ctx.scale(s, s);
  ctx.globalAlpha = clamp(seg(t, 8.3, 8.42)) * fade;
  rr(-130, -40, 260, 80, 12, "rgba(253,226,226,.94)", C.red, 6);
  text("REJECTED", 0, 3, "800 46px 'Bricolage Grotesque'", C.red, "center");
  ctx.restore();
}

function hero(t) {
  const { x, moving, dir } = robotX(t);
  const u = 11;
  const step = moving ? (t * 8) % 1 : 0;
  const legLift = moving ? (step < 0.5 ? [0.55, 0, 0.55, 0] : [0, 0.55, 0, 0.55]) : [0, 0, 0, 0];
  const bob = moving ? Math.abs(Math.sin(t * 8 * Math.PI)) * 5 : 0;
  let y = GROUND - bob, sx = 1, sy = 1, eyes = "open", arm = { l: 0, r: 0 }, rot = 0;
  if (moving) rot = Math.sin(t * 8 * Math.PI) * 0.03;
  if (Math.floor(t * 10) % 31 === 0) eyes = "blink";
  // shock jump with squash and stretch
  if (t > 8.3 && t < 8.85) {
    const k = seg(t, 8.3, 8.85);
    y -= Math.sin(k * Math.PI) * 46;
    sy = k < 0.15 ? 0.82 : 1 + 0.12 * Math.sin(k * Math.PI); sx = 2 - sy;
  }
  if (t > 8.3 && t < 9.6) { eyes = "wide"; arm = { l: -0.6, r: 0.9 }; }
  // happy dance
  if (t > 11.9 && t < 13.3) {
    const k = (t - 11.9) * 3.2, ph = k % 1;
    y -= Math.abs(Math.sin(k * Math.PI)) * 34;
    sy = ph < 0.08 || ph > 0.92 ? 0.86 : 1.06; sx = 2 - sy;
    eyes = "happy"; arm = { l: -0.8, r: 1.4 * Math.abs(Math.sin(k * Math.PI * 2)) };
    rot = Math.sin(k * Math.PI) * 0.08;
  }
  if (t >= 13.3) eyes = "happy";

  // carried boxes
  const carry = [];
  if (t >= 1.6 && t < 4.6) carry.push(C.blue, C.green);
  else if (t >= 4.6 && t < 6.95) carry.push(C.green);
  carry.forEach((icon, i) => {
    const pop = t < 2.3 ? back(seg(t, 1.6 + i * 0.18, 1.9 + i * 0.18)) : 1;
    if (pop <= 0) return;
    ctx.save(); ctx.globalAlpha = clamp(pop * 1.5); const bx = x - 30, by = y - 7.8 * u * sy - i * 48 - (1 - pop) * 60;
    box(bx, by, 60, icon); ctx.restore();
  });

  clawd(x, y, u, { legLift, eyes, arm, sx, sy, flip: dir < 0, rot });

  if (t > 8.3 && t < 9.6) text("!", x + 78, y - 110, "800 64px 'Bricolage Grotesque'", C.red, "center", ease(seg(t, 8.3, 8.4)));

  if (t > 9.9 && t < 10.95) {                               // recording the demo
    const px = x + 64, py = y - 92;
    rr(px, py, 34, 58, 7, C.term);
    rr(px + 4, py + 6, 26, 42, 4, "#2b2824");
    if (Math.floor(t * 4) % 2) { ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(px + 17, py + 20, 6, 0, 7); ctx.fill(); }
    rr(px - 4, py - 30, 44, 22, 11, C.redTint);
    text("REC", px + 18, py - 19, "800 13px 'Bricolage Grotesque'", C.red, "center");
  }
}

function plane(t) {
  if (t < 10.9 || t > 11.65) return;
  const k = easeInOut(seg(t, 10.9, 11.65));
  const sx = IOS_X + 250, sy = GROUND - 90, ex = IOS_X + 118, ey = GROUND - 210;
  const x = lerp(sx, ex, k), y = lerp(sy, ey, k) - Math.sin(k * Math.PI) * 80;
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.45 - k * 0.3); ctx.globalAlpha = 1 - seg(t, 11.5, 11.65);
  ctx.fillStyle = "#ffffff"; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(26, -11); ctx.lineTo(-9, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(26, -11); ctx.lineTo(-6, 3); ctx.stroke();
  ctx.restore();
}

function bubble(t) {
  if (t < 9.4 || t > 10.75) return;
  const a = ease(seg(t, 9.4, 9.6)) * (1 - seg(t, 10.55, 10.75));
  const pop = back(seg(t, 9.4, 9.65));
  const x = robotX(t).x, y = GROUND - 120;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x - 20, y); ctx.scale(pop, pop);
  ctx.shadowColor = "rgba(80,60,40,.18)"; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  rr(-360, -64, 360, 58, 16, "#ffffff");
  ctx.shadowColor = "transparent";
  ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(-40, -8); ctx.lineTo(-14, -8); ctx.lineTo(-6, 12); ctx.fill();
  text("They want a screen recording.", -180, -35, "700 21px 'Bricolage Grotesque'", C.ink, "center");
  ctx.restore();
}

function confetti(t) {
  if (t < 11.9 || t > 13.6) return;
  const cols = [C.clawd, C.blue, C.green, "#e0a63a", C.ink];
  for (let i = 0; i < 90; i++) {
    const life = t - 11.9 - rand(i) * 0.3;
    if (life < 0) continue;
    const ang = -Math.PI / 2 + (rand(i + 7) - 0.5) * 2.4;
    const sp = 420 + rand(i + 3) * 460;
    const x = IOS_X + 180 + Math.cos(ang) * sp * life;
    const y = GROUND - 100 + Math.sin(ang) * sp * life + 760 * life * life;
    ctx.save(); ctx.translate(x, y); ctx.rotate(life * 10 + i); ctx.scale(1, Math.cos(life * 14 + i));
    ctx.globalAlpha = 1 - seg(t, 13.1, 13.6);
    ctx.fillStyle = cols[i % cols.length];
    if (i % 3) ctx.fillRect(-6, -3, 12, 6); else { ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill(); }
    ctx.restore();
  }
}

function caption(t) {
  for (const [a, b, s, color] of CAPTIONS) {
    if (t < a || t > b) continue;
    const k = (a === 0 ? 1 : ease(seg(t, a, a + 0.35))) * (1 - seg(t, b - 0.2, b));
    ctx.save(); ctx.globalAlpha = k;
    text(s, 64, 170 + (1 - k) * 14, "800 50px 'Bricolage Grotesque'", color);
    ctx.restore();
  }
}

function promptBar(t) {
  rr(40, 30, W - 80, 66, 16, C.term);
  const n = Math.floor(seg(t, 0.05, 0.9) * PROMPT.length);
  text("›", 68, 63, "700 24px 'JetBrains Mono'", C.clawd);
  text(PROMPT.slice(0, n), 96, 63, "400 21px 'JetBrains Mono'", C.termText);
  if (t < 1.0 || Math.floor(t * 2) % 2) {
    ctx.font = "400 21px 'JetBrains Mono'";
    ctx.fillStyle = C.clawd; ctx.fillRect(96 + ctx.measureText(PROMPT.slice(0, n)).width + 4, 50, 11, 26);
  }
  text("shipstores MCP", W - 68, 63, "700 16px 'JetBrains Mono'", C.clawd, "right", ease(seg(t, 0.9, 1.2)));
}

function logPanel(t) {
  const y0 = 560;
  rr(40, y0, W - 80, 130, 16, C.term);
  const shown = LOG.filter(([at]) => t >= at).slice(-3);
  shown.forEach(([at, tool, detail, tag], i) => {
    const y = y0 + 32 + i * 33;
    const isLast = i === shown.length - 1;
    ctx.save(); ctx.globalAlpha = isLast ? ease(seg(t, at, at + 0.25)) : 0.45 + 0.25 * i;
    ctx.fillStyle = C.okGreen; ctx.beginPath(); ctx.arc(72, y, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = C.term; ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(67.5, y); ctx.lineTo(71, y + 3.5); ctx.lineTo(77, y - 3.5); ctx.stroke();
    text(tool, 96, y, "700 19px 'JetBrains Mono'", C.toolBlue);
    ctx.font = "700 19px 'JetBrains Mono'";
    let x = 96 + ctx.measureText(tool).width + 18;
    if (tag) {
      ctx.font = "400 14px 'JetBrains Mono'";
      const tw = ctx.measureText(tag).width + 20, tc = tag === "rejected" ? "#ff7a7a" : C.tagOrange;
      rr(x, y - 13, tw, 26, 13, null, tc);
      text(tag, x + tw / 2, y + 1, "400 14px 'JetBrains Mono'", tc, "center");
      x += tw + 12;
    }
    text("→ " + detail, x, y, "400 19px 'JetBrains Mono'", C.termText);
    ctx.restore();
  });
}

function outro(t) {
  const k = ease(seg(t, 13.4, 14.1));
  if (k <= 0) return;
  const out = 1 - seg(t, DURATION - 0.45, DURATION);
  ctx.save(); ctx.globalAlpha = k * out;
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(1000, 320, 0, 1000, 320, 520);
  g.addColorStop(0, "rgba(217,119,87,0.22)"); g.addColorStop(1, "rgba(244,240,232,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.font = "800 148px 'Bricolage Grotesque'"; ctx.fillStyle = C.ink; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  const wx = 90, wy = 320;
  ctx.fillText("shipstores", wx, wy);
  const ww = ctx.measureText("shipstores").width;
  ctx.fillStyle = C.clawd; ctx.fillRect(wx + ww + 6, wy - 30, 30, 30);
  text("Ship iOS and Android apps from your AI agent.", wx + 4, wy + 60, "500 38px 'Bricolage Grotesque'", C.ink);
  rr(wx, wy + 108, 330, 64, 14, C.term);
  text("$", wx + 26, wy + 141, "700 30px 'JetBrains Mono'", C.clawd);
  text("uvx shipstores", wx + 56, wy + 141, "400 30px 'JetBrains Mono'", C.termText);
  text("App Store Connect · Google Play · Expo EAS · 60 tools · MIT", wx + 2, wy + 218, "400 20px 'JetBrains Mono'", C.ink2);
  // Clawd waves
  const wave = Math.abs(Math.sin((t - 13.4) * 6));
  const pop = back(seg(t, 13.6, 14.2));
  clawd(1095, 470 - Math.abs(Math.sin((t - 13.4) * 2.4)) * 10, 19 * pop, { eyes: "happy", arm: { l: 0, r: 1.2 + wave * 1.2 } });
  ctx.restore();
}

// ---------------------------------------------------------------- frame
function renderAt(t) {
  ctx.clearRect(0, 0, W, H);
  backdrop();
  workshop(t);
  const iosKind = t >= 11.75 ? "wait" : t >= 8.3 ? "rej" : t >= 5.45 ? "wait" : "none";
  const playKind = t >= 7.8 ? "review" : "none";
  shop(IOS_X, "App Store", C.blue, C.blueTint, iosKind, t >= 8.3 && t < 11.75, t);
  shop(PLAY_X, "Google Play", C.green, C.greenTint, playKind, false, t);
  if (t >= 4.6) box(IOS_X + 20, GROUND, 52, C.blue);
  if (t >= 6.95) box(PLAY_X + 20, GROUND, 52, C.green);
  hero(t);
  bubble(t);
  plane(t);
  stamp(t);
  confetti(t);
  caption(t);
  promptBar(t);
  logPanel(t);
  outro(t);
}

window.DURATION = DURATION;
window.renderAt = renderAt;
window.ready = Promise.all([
  "800 148px 'Bricolage Grotesque'", "800 50px 'Bricolage Grotesque'", "700 17px 'Bricolage Grotesque'", "500 38px 'Bricolage Grotesque'",
  "400 21px 'JetBrains Mono'", "700 19px 'JetBrains Mono'",
].map(f => document.fonts.load(f))).then(() => true);

window.ready.then(() => {
  if (location.search.includes("capture")) { renderAt(0.9); return; }
  const t0 = performance.now();
  const loop = now => { renderAt(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
