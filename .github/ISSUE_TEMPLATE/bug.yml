name: Bug
description: Something is wrong in a tool that uses the public APIs
labels: [bug]
body:
  - type: input
    id: tool
    attributes: {label: Tool}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: shipstores version, placeholder: "0.2.0", description: "uvx runs the latest release unless you pinned one"}
  - type: input
    id: client
    attributes: {label: MCP client, placeholder: Claude Code, Claude Desktop, Cursor...}
  - type: textarea
    id: details
    attributes: {label: What happened, description: Input you passed and the error. Redact keys and ids.}
    validations: {required: true}
