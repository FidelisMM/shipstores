[project]
name = "shipstores"
version = "0.1.0"
description = "MCP server to ship iOS and Android apps from AI agents: App Store Connect, Google Play Console and Expo EAS"
license = "MIT"
authors = [{ name = "Matheus Fidelis" }]
keywords = ["mcp", "model-context-protocol", "app-store-connect", "google-play", "expo", "eas", "ios", "android", "claude", "fastlane-alternative"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0",
    "google-auth>=2.57.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/FidelisMM/shipstores"
Issues = "https://github.com/FidelisMM/shipstores/issues"

[project.scripts]
shipstores = "shipstores.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipstores"]
